[package]
name = "spew-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Lets the coding agents on your computers and your team's ask each other questions, peer to peer."
readme = "README.md"
keywords = ["agents", "mcp", "p2p", "iroh", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "spew"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.4"
iroh = "1.3.0"
iroh-mdns-address-lookup = "0.6.0"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
url = "2.5"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
